[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "env-setup-agent"
version = "0.1.0"
description = "AI agent for generating Docker environments for Python repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "jinja2>=3.1.0",
  "jsonschema>=4.0.0",
  "pyyaml>=6.0",
  "requests",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "ruff>=0.6.8", "mypy>=1.0.0"]

[project.scripts]
env-setup-agent = "env_setup_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
exclude = [".git", ".venv", "build", "dist", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["env_setup_agent"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
